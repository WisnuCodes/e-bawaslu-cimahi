<div class="page-header">
  <h2>Ekspor Laporan</h2>
  <p>Unduh rekapitulasi presensi dan aktivitas harian pegawai dalam format PDF.</p>
</div>
<mat-card class="report-card">
  <mat-card-content>
    <div class="report-form">
      <div>
        <h3 id="report-type-label">Jenis laporan</h3>
        <div class="report-options" role="group" aria-labelledby="report-type-label">
          <button type="button" class="report-option" [class.selected]="tipeLaporan === 'presensi'" [attr.aria-pressed]="tipeLaporan === 'presensi'" (click)="tipeLaporan = 'presensi'">
            <mat-icon>how_to_reg</mat-icon>
            <span><strong>Rekap Presensi</strong><small>Jam masuk, pulang, dan status kehadiran.</small></span>
          </button>
          <button type="button" class="report-option" [class.selected]="tipeLaporan === 'worklog'" [attr.aria-pressed]="tipeLaporan === 'worklog'" (click)="tipeLaporan = 'worklog'">
            <mat-icon>assignment</mat-icon>
            <span><strong>Rekap Worklog</strong><small>Aktivitas harian dan status persetujuan.</small></span>
          </button>
        </div>
      </div>
      <mat-divider></mat-divider>
      <div>
        <h3>Periode laporan</h3>
        <div class="form-grid" [formGroup]="dateRange">
          <mat-form-field appearance="outline">
            <mat-label>Rentang Waktu</mat-label>
            <mat-date-range-input [rangePicker]="picker">
              <input matStartDate formControlName="start" placeholder="Mulai tanggal">
              <input matEndDate formControlName="end" placeholder="Sampai tanggal">
            </mat-date-range-input>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>
          </mat-form-field>
        </div>
      </div>
      <div class="report-note"><mat-icon>info_outline</mat-icon><p>PDF menyertakan watermark identitas pengunduh untuk menjaga keamanan dan keaslian data.</p></div>
      <div class="report-actions">
        <button mat-flat-button color="primary" [disabled]="isExporting" (click)="exportReport()">
          <mat-icon *ngIf="!isExporting">download</mat-icon>
          <mat-progress-spinner *ngIf="isExporting" diameter="18" mode="indeterminate"></mat-progress-spinner>
          {{ isExporting ? 'Memproses dokumen...' : 'Ekspor ke PDF' }}
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>
