<mat-card class="form-card mb-6">
  <mat-card-header>
    <mat-card-title>{{ isEditMode ? 'Edit Laporan Kerja' : 'Laporan Kerja (Worklog)' }}</mat-card-title>
    <mat-card-subtitle>{{ isEditMode ? 'Ubah aktivitas atau lampiran.' : 'Tuliskan aktivitas pekerjaan hari ini.' }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="worklogForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 mt-4">
      
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Rincian Aktivitas</mat-label>
        <textarea matInput formControlName="activity" rows="4" 
                  placeholder="Contoh: Mengawasi pemungutan suara di TPS 01, Merekapitulasi hasil perhitungan..."
                  title="Rincian Aktivitas"></textarea>
        <mat-error *ngIf="worklogForm.get('activity')?.hasError('required')">
          Rincian aktivitas wajib diisi.
        </mat-error>
      </mat-form-field>

      <div class="file-upload-container mb-2">
        <label class="block text-sm font-medium text-gray-700 mb-2">
          File Lampiran (PDF, JPG, PNG) <span class="text-gray-400 font-normal ml-1">(Opsional)</span>
        </label>
        <div class="flex items-center gap-4">
          <button type="button" mat-stroked-button color="primary" (click)="fileInput.click()">
            <mat-icon>attach_file</mat-icon> Pilih File
          </button>
          <span class="text-sm text-gray-600 truncate max-w-[200px]" *ngIf="selectedFile">
            {{ selectedFile.name }}
          </span>
          <span class="text-sm text-gray-400" *ngIf="!selectedFile">
            Belum ada file yang dipilih
          </span>
        </div>
        <input type="file" #fileInput (change)="onFileSelected($event)" accept=".pdf,image/*" class="hidden" title="Upload File Lampiran" placeholder="Pilih File">
      </div>

      <div class="flex gap-2">
        <button mat-raised-button color="primary" type="submit" [disabled]="worklogForm.invalid || isSubmittingLog">
          <mat-spinner diameter="20" *ngIf="isSubmittingLog" class="mr-2"></mat-spinner>
          <mat-icon *ngIf="!isSubmittingLog">{{ isEditMode ? 'save' : 'send' }}</mat-icon>
          {{ isEditMode ? 'Simpan Perubahan' : 'Kirim Worklog' }}
        </button>

        <button mat-button type="button" *ngIf="isEditMode" (click)="onCancelEdit()" [disabled]="isSubmittingLog">
          Batal
        </button>
      </div>

    </form>
  </mat-card-content>
</mat-card>
