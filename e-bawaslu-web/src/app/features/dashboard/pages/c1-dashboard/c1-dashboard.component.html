<div class="c1-dashboard-container" @fadeInUp>

  <div class="header-section">
    <div class="header-content">
      <h1 class="page-title">Monitoring Form C1 {{ state().kamar }}</h1>
      <p class="page-subtitle">Pusat tabulasi, pemantauan, dan OCR Form C1-Hasil secara real-time.</p>
    </div>
    

  </div>

  <app-c1-filter
    [kamar]="state().kamar"
    [kecamatanList]="kecamatanList()"
    [kelurahanList]="kelurahanList()"
    [filteredTps]="filteredTps()"
    [availableYears]="state().availableYears"
    [selectedKecamatan]="state().selectedKecamatan"
    [selectedKelurahan]="state().selectedKelurahan"
    [selectedFilterTps]="state().selectedFilterTps"
    [selectedFilterYear]="state().selectedFilterYear"
    (selectedKecamatanChange)="onKecamatanChange($event)"
    (selectedKelurahanChange)="onKelurahanChange($event)"
    (regionChange)="onRegionChange($event)"
    (filterTpsChange)="facade.onFilterTpsChange($event)"
    (filterYearChange)="facade.onFilterYearChange($event)"
  ></app-c1-filter>

  <app-c1-kpi-cards
    [totalTpsPilot]="totalTpsPilot()"
    [c1ListLength]="c1ListLength()"
    [progressPercentage]="progressPercentage()"
    [verifiedProgressPercentage]="verifiedProgressPercentage()"
    [totalSuaraSahKota]="totalSuaraSahKota()"
    [totalSuaraTidakSahKota]="totalSuaraTidakSahKota()"
    [totalPemilihKota]="totalPemilihKota()"
    [totalMismatchCount]="totalMismatchCount()"
    [totalSuaraPaslonKota]="totalSuaraPaslonKota()"
  ></app-c1-kpi-cards>

  <app-c1-upload-form *ngIf="canWriteDocuments()"
    [canWriteDocuments]="canWriteDocuments()"
    [c1Form]="facade.c1Form"
    [tpsList]="filteredTps()"
    [sumSuaraPaslon]="sumSuaraPaslon"
    [isMismatch]="isMismatch"
    [totalSuaraMasukForm]="totalSuaraMasukForm"
    [selectedFile]="state().selectedFile"
    [isOcrScanning]="state().isOcrScanning"
    [ocrStatusText]="state().ocrStatusText"
    [editingC1Id]="state().editingC1Id"
    [isAdmin]="isAdmin()"
    [isUploading]="state().isUploading"
    (jumlahPaslonChange)="facade.onJumlahPaslonChange($event)"
    (fileSelected)="onFileSelected($event)"
    (cancelEdit)="facade.resetForm()"
    (submitForm)="facade.submitForm()"
  ></app-c1-upload-form>

  <app-c1-data-table
    [c1List]="state().c1List"
    [tpsList]="state().tpsList"
    [divisiList]="state().divisiList"
    [savingApproval]="savingApproval()"
    [canDeleteC1]="canDeleteC1()"
    [isSuperAdmin]="isSuperAdmin()"
    [currentUserDivisiId]="currentUserDivisiId()"
    [currentUserRole]="currentUserRole()"
    [isPimpinan]="isPimpinan()"
    [isKadivP2H]="isKadivP2H()"
    [canWriteDocuments]="canWriteDocuments()"
    (download)="facade.downloadC1($event)"
    (assignApproval)="onAssignApproval($event)"
    (approve)="onApprove($event)"
    (edit)="facade.editC1($event)"
    (delete)="onDelete($event)"
    (copyHash)="copyHash($event)"
  ></app-c1-data-table>

</div>
