<!-- Modal: Unggah Arsip Baru -->
<div class="styled-e58d47" *ngIf="facade.showUploadModal()" >
  <div class="styled-84abf8" >
    <div class="styled-ce1757" >
      <h3 class="styled-3c1187" >Registrasi Arsip Baru (v1.0)</h3>
      <button mat-icon-button (click)="facade.setModal('showUploadModal', false)">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <form class="styled-e743eb" [formGroup]="uploadForm" (ngSubmit)="submitUpload()" >
      <mat-form-field appearance="outline">
        <mat-label>Divisi Pemilik</mat-label>
        <mat-select formControlName="divisi_id" title="Select field" placeholder="Pilih...">
          <mat-option *ngFor="let div of facade.divisiList()" [value]="div.divisi_id">{{ div.nama_divisi }}</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Nomor Surat</mat-label>
          <input matInput formControlName="no_surat" placeholder="Contoh: 001/BAWASLU/2026" title="Input field">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Tanggal Surat</mat-label>
          <input matInput type="date" formControlName="tgl_surat" title="Input field" placeholder="...">
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Perihal Surat / Dokumen</mat-label>
        <textarea matInput formControlName="perihal" rows="2" placeholder="Tulis perihal atau ringkasan isi surat..."></textarea>
      </mat-form-field>

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Kategori</mat-label>
          <mat-select formControlName="kategori" title="Select field" placeholder="Pilih...">
            <mat-option *ngFor="let kat of kategoriList" [value]="kat">{{ kat }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Klasifikasi Keamanan</mat-label>
          <mat-select formControlName="klasifikasi" title="Select field" placeholder="Pilih...">
            <mat-option *ngFor="let klas of klasifikasiList" [value]="klas">{{ klas }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Jenjang Pengawas (wajib untuk MHP)</mat-label>
        <mat-select formControlName="jenjang_pengawas" title="Select field" placeholder="Pilih...">
          <mat-option value="">Internal</mat-option>
          <mat-option *ngFor="let jenjang of jenjangList" [value]="jenjang">{{ jenjang }}</mat-option>
        </mat-select>
      </mat-form-field>
      
      <!-- File Upload Button -->
      <div>
        <label class="styled-fc935c" >Berkas Dokumen (PDF, DOC, DOCX, JPG, PNG)</label>
        <div class="styled-ff1bae" >
          <button type="button" mat-stroked-button color="primary" (click)="uploadFileInput.click()">
            <mat-icon>attach_file</mat-icon> Pilih Berkas
          </button>
          <span class="styled-3857a4" >
            {{ uploadFile ? uploadFile.name : 'Belum ada file dipilih' }}
          </span>
          <input class="styled-d35118" type="file" #uploadFileInput (change)="onUploadFileSelected($event)" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"  title="Input field" placeholder="...">
        </div>
        <app-file-preview [file]="uploadFile"></app-file-preview>
      </div>

      <div class="styled-540b55" >
        <button type="button" mat-stroked-button (click)="facade.setModal('showUploadModal', false)">Batal</button>
        <button type="submit" mat-flat-button color="primary" [disabled]="uploadForm.invalid || !uploadFile || facade.isUploading()">
          <mat-icon *ngIf="!facade.isUploading()">cloud_upload</mat-icon>
          <mat-progress-spinner class="styled-b0eb74" *ngIf="facade.isUploading()" diameter="18" mode="indeterminate" ></mat-progress-spinner>
          {{ facade.isUploading() ? 'Mengunggah...' : 'Simpan & Daftarkan' }}
        </button>
      </div>
    </form>
  </div>
</div>
