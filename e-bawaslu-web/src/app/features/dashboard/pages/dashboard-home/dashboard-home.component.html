<div class="dashboard-header animate-fade-in">

  <p>Kelola Presensi WFH, Dokumen Arsip, dan Laporan C1 Anda dari satu tempat.</p>
</div>

      </div>

        <p class="stat-value">124</p>
      </div>
    </div>
  </app-card>

  <app-card title="Status WFH">

      <div class="stat-icon bg-success-light text-success">
        <mat-icon>work_outline</mat-icon>
      </div>
      <div class="stat-info">
        <p class="stat-value text-success">Checked In</p>
      </div>
    </div>
  </app-card>
</div>
