<header class="header">
  <div class="header-left">
    <button *ngIf="isMobile" class="hamburger-btn" (click)="onToggleMenu()">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand-group">
      <span class="brand-badge">SIM BAWASLU</span>
      <h2 class="page-title">Bawaslu Kota Cimahi</h2>
    </div>
  </div>
  
  <div class="header-right">
    <a routerLink="/dashboard/struktur-organisasi" class="struktur-link hide-mobile">
      &#x1F3DB;&#xFE0F; Lihat Bagan Struktur
    </a>
    
    <div class="user-profile">
      <div class="avatar">
        {{ userInitial() }}
      </div>
      <div class="user-info hide-mobile">
        <span class="user-name">
          {{ userName() | slice:0:16 }}{{ (userName().length) > 16 ? '...' : '' }}
        </span>
        <span class="user-role-label">
          {{ userRole() }}
        </span>
      </div>
    </div>
  </div>
</header>
