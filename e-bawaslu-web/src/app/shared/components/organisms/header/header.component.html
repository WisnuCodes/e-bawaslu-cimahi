<header class="header">
  <div class="header-left">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="background: #1e3a8a; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700;">
        SIM BAWASLU
      </span>
      <h2 class="page-title" style="margin: 0; font-size: 1.1rem; color: #1e293b;">Bawaslu Kota Cimahi</h2>
    </div>
  </div>
  
  <div class="header-right">
    <a routerLink="/dashboard/struktur-organisasi" style="text-decoration: none; font-size: 0.8rem; font-weight: 600; color: var(--color-primary); background: rgba(138, 43, 226, 0.08); padding: 6px 12px; border-radius: 6px; display: flex; align-items: center; gap: 4px;">
      🏛️ Lihat Bagan Struktur
    </a>
    
    <div class="user-profile">
      <div class="avatar" style="background: var(--color-primary); color: white; font-weight: 700;">
        {{ userInitial() }}
      </div>
      <div class="user-info">
        <span class="user-name" style="font-weight: 700; color: #0f172a; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
          {{ userName() }}
        </span>
        <span class="user-role" style="color: var(--color-primary); font-weight: 600; font-size: 0.75rem;">
          {{ userRole() }}
        </span>
      </div>
    </div>
  </div>
</header>
